name: docker-build

on:
    workflow_call:
        inputs:
            service:
                required: true
                type: string
        secrets:
            DOCKERHUB_USERNAME:
                required: true
            DOCKERHUB_TOKEN:
                required: true

jobs:   
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            
            - name: Login to DockerHub
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}
            
            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                context: ./${{ inputs.service }}
                push: true
                tags: |
                    taufik041/todo-${{ inputs.service }}:latest
                    taufik041/todo-${{ inputs.service }}:${{ github.sha }}