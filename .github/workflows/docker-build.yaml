name: docker-build

on:
    workflow_call:
        inputs:
            service:
                required: true
                type: string
            dockerpath:
                required: true
                type: string
            push:
                required: false
                type: boolean
                default: true
        secrets:
            DOCKERHUB_USERNAME:
                required: false
            DOCKERHUB_TOKEN:
                required: false

jobs:   
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                token: ${{ secrets.CI_PUSH_TOKEN || github.token }}
            
            - name: Login to DockerHub
              if: ${{ inputs.push }}
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}
            
            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                context: .
                file: ${{ inputs.dockerpath }}
                push: ${{ inputs.push }}
                tags: |
                    taufik041/todo-${{ inputs.service }}:latest
                    taufik041/todo-${{ inputs.service }}:${{ github.sha }}
            
            - name: Update image tag in values.yaml
              if: ${{ inputs.push }}
              run: |
                yq -i '.${{ inputs.service }}.image.tag = "${{ github.sha }}"' helm/todo-app/values.yaml
                git config user.name "github-actions[bot]"
                git config user.email "github-actions[bot]@users.noreply.github.com"
                git add helm/todo-app/values.yaml
                git commit -m "ci: deploy ${{ inputs.service }} ${{ github.sha }}" || exit 0
                git pull --rebase origin main
                git push