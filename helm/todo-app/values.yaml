namespace: todo-app

api:
  image: taufik041/todo-api:latest
  serviceType: ClusterIP
  replicas: 1
  port: 8000
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"

worker:
  image: taufik041/todo-worker:latest
  replicas: 1
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"

frontend:
  image: taufik041/todo-frontend:latest
  serviceType: ClusterIP
  replicas: 1
  port: 3000
  apiUrl: "http://api:8000"
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"

storageClass:
  create: true
  name: gp3

postgres:
  image: postgres:16-alpine
  port: 5432
  database: todos
  username: postgres
  password: postgres
  storage: 1Gi
  storageClassName: gp3

redis:
  image: redis:7-alpine
  port: 6379

rabbitmq:
  image: rabbitmq:3-management-alpine
  port: 5672
  managementPort: 15672