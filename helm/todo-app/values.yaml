namespace: todo-app

api:
  image:
    repository: taufik041/todo-api
    tag: latest
  serviceType: ClusterIP
  replicas: 1
  port: 8000
  nodePort: 30001
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"

worker:
  image:
    repository: taufik041/todo-worker
    tag: latest
  replicas: 1
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"

frontend:
  image:
    repository: taufik041/todo-frontend
    tag: latest
  serviceType: ClusterIP
  replicas: 1
  port: 3000
  apiUrl: "http://api:8000"
  nodePort: 30000
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"

storageClass:
  create: true
  name: gp3

postgres:
  image: postgres:16-alpine
  port: 5432
  database: todos
  storage: 1Gi
  storageClassName: gp3
  # username: postgres
  # password: postgres

redis:
  image: redis:7-alpine
  port: 6379

rabbitmq:
  image: rabbitmq:3-management-alpine
  port: 5672
  managementPort: 15672

eso:
  enabled: true

# Local/Kind mode: set eso.enabled to false and uncomment below
# jwtSecret: dev-secret-change-me

gateway:
  enabled: true